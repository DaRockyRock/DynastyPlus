name: Feature request
description: Suggest an improvement to Dynasty+ Tools.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thanks for sharing an idea. Explain the problem first so the best solution can be discussed.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Dynasty library and import
        - Conference editor
        - Schedule editor
        - Playoff format editor
        - Playoff bracket editor
        - Bowl games editor
        - Rankings editor
        - Recruiting tool
        - Setup and game art
        - Desktop packaging
        - Developer tooling
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What is difficult, missing, or unclear today?
      placeholder: Describe the use case and who it affects.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe how you would like Dynasty+ Tools to behave.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Share any workarounds or other approaches you considered.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add mockups, examples, or links that help explain the request.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and discussions and did not find a duplicate.
          required: true
        - label: I would be willing to help implement this feature.
          required: false
